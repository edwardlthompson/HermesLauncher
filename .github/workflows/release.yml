name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for SBOM upload (e.g. v0.9.0); defaults to v.template-version
        required: false
        type: string
  release:
    types: [published]

permissions: read-all

jobs:
  tag-gate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Tag gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches .template-version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(tr -d '[:space:]' < .template-version)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match .template-version ($VERSION)"
            exit 1
          fi

      - name: Poll required CI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-github-ci.sh HEAD --wait 300

  sbom-assets:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: SBOM and release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          # SBOM backfill (workflow_dispatch + tag input): build from main, upload to existing tag
          ref: ${{ inputs.tag != '' && github.ref || steps.tag.outputs.tag || github.ref }}

      - name: Finalize release tag from .template-version
        if: steps.tag.outputs.tag == ''
        id: tag_ver
        run: echo "tag=v$(tr -d '[:space:]' < .template-version)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches .template-version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          STEP_TAG: ${{ steps.tag.outputs.tag }}
          STEP_TAG_VER: ${{ steps.tag_ver.outputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            EFFECTIVE="$INPUT_TAG"
          else
            EFFECTIVE="${STEP_TAG:-$STEP_TAG_VER}"
          fi
          TAG="${EFFECTIVE#v}"
          VERSION=$(tr -d '[:space:]' < .template-version)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match .template-version ($VERSION)"
            exit 1
          fi
          echo "EFFECTIVE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Poll post-merge CI before SBOM upload
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-github-ci.sh HEAD --wait 3600

      - name: Pre-release gate (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: bash scripts/pre-release-gate.sh

      - name: Generate root SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate web stack SBOM slice
        if: hashFiles('examples/web/package.json') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: examples/web
          format: cyclonedx-json
          output-file: sbom-web.cyclonedx.json

      - name: Generate python stack SBOM slice
        if: hashFiles('examples/python/pyproject.toml') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: examples/python
          format: cyclonedx-json
          output-file: sbom-python.cyclonedx.json

      - name: Generate node stack SBOM slice
        if: hashFiles('examples/node/package.json') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: examples/node
          format: cyclonedx-json
          output-file: sbom-node.cyclonedx.json

      - name: Generate android stack SBOM slice
        if: hashFiles('examples/android/app/build.gradle.kts') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: examples/android
          format: cyclonedx-json
          output-file: sbom-android.cyclonedx.json

      - name: Generate rust stack SBOM slice
        if: hashFiles('examples/rust/Cargo.lock') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: examples/rust
          format: cyclonedx-json
          output-file: sbom-rust.cyclonedx.json

      - name: Generate go stack SBOM slice
        if: hashFiles('examples/go/go.sum') != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: examples/go
          format: cyclonedx-json
          output-file: sbom-go.cyclonedx.json

      - name: Generate Winget manifest stub
        run: |
          bash scripts/generate-winget-manifest.sh "AgentProjectBootstrap.Template" "$(tr -d '[:space:]' < .template-version)"
          bash scripts/validate-winget-stub.sh

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.2.0
        with:
          subject-path: sbom.cyclonedx.json

      - name: Upload SBOM assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${EFFECTIVE_TAG:-${{ steps.tag.outputs.tag || steps.tag_ver.outputs.tag }}}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "FAIL: release $TAG not found (merge Release Please PR first)"
            exit 1
          fi
          FILES=(packaging/winget/manifest.stub.yaml sbom.cyclonedx.json)
          if [ -f openvex.json ]; then
            cp openvex.json openvex-upload.json
          else
            cp schemas/golden-path/openvex.example.json openvex-upload.json
          fi
          mv openvex-upload.json openvex.json
          FILES+=(openvex.json)
          [ -f sbom-web.cyclonedx.json ] && FILES+=(sbom-web.cyclonedx.json)
          [ -f sbom-python.cyclonedx.json ] && FILES+=(sbom-python.cyclonedx.json)
          [ -f sbom-node.cyclonedx.json ] && FILES+=(sbom-node.cyclonedx.json)
          [ -f sbom-android.cyclonedx.json ] && FILES+=(sbom-android.cyclonedx.json)
          [ -f sbom-rust.cyclonedx.json ] && FILES+=(sbom-rust.cyclonedx.json)
          [ -f sbom-go.cyclonedx.json ] && FILES+=(sbom-go.cyclonedx.json)
          gh release upload "$TAG" "${FILES[@]}" --clobber

  android-apk:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: Upload FOSS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && github.ref || steps.tag.outputs.tag || github.ref }}

      - name: Finalize release tag from .template-version
        if: steps.tag.outputs.tag == ''
        id: tag_ver
        run: echo "tag=v$(tr -d '[:space:]' < .template-version)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches .template-version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          STEP_TAG: ${{ steps.tag.outputs.tag }}
          STEP_TAG_VER: ${{ steps.tag_ver.outputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            EFFECTIVE="$INPUT_TAG"
          else
            EFFECTIVE="${STEP_TAG:-$STEP_TAG_VER}"
          fi
          TAG="${EFFECTIVE#v}"
          VERSION=$(tr -d '[:space:]' < .template-version)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match .template-version ($VERSION)"
            exit 1
          fi
          echo "EFFECTIVE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Write upload keystore from repository secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-write-android-keystore.sh

      - name: assembleRelease with SOURCE_DATE_EPOCH
        working-directory: examples/android
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Verify release APK is signed
        run: |
          APK=$(find examples/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "FAIL: no release APK produced"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "FAIL: apksigner not found under ANDROID_HOME"
            exit 1
          fi
          "$APKSIGNER" verify --min-sdk-version 26 "$APK"

      - name: Upload FOSS APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${EFFECTIVE_TAG:-${{ steps.tag.outputs.tag || steps.tag_ver.outputs.tag }}}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "FAIL: release $TAG not found (merge Release Please PR first)"
            exit 1
          fi
          APK=$(find examples/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "FAIL: no release APK produced"
            exit 1
          fi
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' examples/android/app/build.gradle.kts | head -1)
          NAME="hermes-launcher-${APP_VERSION}-foss.apk"
          cp "$APK" "$NAME"
          gh release upload "$TAG" "$NAME" --clobber
          echo "Uploaded $NAME to $TAG"
